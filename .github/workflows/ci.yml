name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validar docker-compose
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml config -q
      - name: Detectar secretos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        run: go test -race -cover ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -exclude-generated ./...
      - name: Build image
        run: docker build -t tiquetera-api:ci .
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tiquetera-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Generated code up to date
        run: |
          flutter gen-l10n
          dart run build_runner build -d
          git diff --exit-code
      - run: flutter analyze
      - run: flutter test
