name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml config -q
      - name: Detectar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # backend: se agrega en S02 (lint, test, govulncheck, gosec)
  # mobile: se agrega en S08 (analyze, test)
