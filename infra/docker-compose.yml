name: tiquetera

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - db-data:/var/lib/postgresql # PG18+: datos en subdirectorio por versión (facilita pg_upgrade)
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../backend
    image: tiquetera-api:dev
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DATABASE_URL: postgres://tiquetera_app:${APP_DB_PASSWORD:?required}@db:5432/${POSTGRES_DB}?sslmode=disable
      TZ: ${TZ:-America/Bogota}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8088}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    mem_limit: 256m

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: [tools]
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ../backend/db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  db-app-user:
    image: postgres:18.6-alpine
    profiles: [tools]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        echo "ALTER ROLE tiquetera_app LOGIN PASSWORD :'pw';" |
        psql -q -v ON_ERROR_STOP=1 -v pw="$$APP_DB_PASSWORD" -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  seed:
    build:
      context: ../backend
    image: tiquetera-api:dev
    profiles: [tools]
    entrypoint: ["/seed"]
    environment:
      DATABASE_URL: postgres://tiquetera_app:${APP_DB_PASSWORD:?required}@db:5432/${POSTGRES_DB}?sslmode=disable
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NOMBRE: ${SEED_ADMIN_NOMBRE:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true

volumes:
  db-data:

networks:
  backend:
